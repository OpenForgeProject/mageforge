version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
    labels:
      - Dependencies
    # Wait after release before opening update PRs — gives the ecosystem time
    # to catch malicious releases (supply-chain protection).
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Major updates land as separate PRs so they can be reviewed individually.
    # Note: only the first matching group applies, so the phpunit group must
    # come before the catch-all dev-dependencies group.
    groups:
      phpunit:
        patterns:
          - phpunit/*
          - sebastian/*
          - myclabs/*
          - theseer/*
          - phar-io/*
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - Dependencies
    # Actions are pulled by SHA, but a compromised release is still a risk —
    # wait a week so takedowns/reverts can happen first. semver-major-days is
    # not supported for the github-actions ecosystem, so only the default
    # cooldown applies here.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
