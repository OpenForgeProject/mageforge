server {
    listen 443 ssl http2;
    server_name mageforge.example.com;

    root /var/www/mageforge;
    index index.html;
    charset utf-8;

    # ssl_certificate / ssl_certificate_key …

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The site only loads its own CSS/JS/images and has no inline scripts.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Assets are not fingerprinted, so keep the cache short.
    location /assets/ {
        expires 1d;
        try_files $uri =404;
    }

    # Changelog data changes with every release.
    location ~* \.(xml|json)$ {
        expires 10m;
    }

    error_page 404 /404.html;
}
